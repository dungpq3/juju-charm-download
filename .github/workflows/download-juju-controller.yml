name: Download juju-controller charm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Juju CLI
        run: |
          set -euo pipefail

          VERSION="3.6.21"

          curl -fL -O "https://github.com/juju/juju/releases/download/v${VERSION}/juju-${VERSION}-linux-amd64.tar.xz"
          tar xf "juju-${VERSION}-linux-amd64.tar.xz"

          sudo install -m 0755 juju /usr/local/bin/juju
          juju version

      - name: Debug Charmhub connectivity
        run: |
          set +e

          echo "===== DNS ====="
          getent ahostsv4 api.charmhub.io || true

          echo
          echo "===== TLS probe ====="
          for i in $(seq 1 5); do
            echo "---- probe $i ----"
            curl -4 -vkI --connect-timeout 15 --max-time 40 https://api.charmhub.io/ 2>&1 | sed -n '1,80p'
            sleep 10
          done

      - name: Download controller charm with retries
        run: |
          set -euo pipefail

          mkdir -p out

          for i in $(seq 1 12); do
            echo
            echo "===== attempt $i ====="

            rm -f ./out/juju-controller-3.6-stable-ubuntu24.04-amd64.charm

            if timeout 180 juju download juju-controller \
              --channel 3.6/stable \
              --base ubuntu@24.04 \
              --arch amd64 \
              --filepath ./out/juju-controller-3.6-stable-ubuntu24.04-amd64.charm \
              --no-progress; then
              echo "Download OK"
              break
            fi

            sleep 30
          done

          test -s ./out/juju-controller-3.6-stable-ubuntu24.04-amd64.charm

          sha256sum ./out/juju-controller-3.6-stable-ubuntu24.04-amd64.charm | tee ./out/SHA256SUMS
          ls -lh ./out

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: juju-controller-${{ matrix.os }}
          path: out/
          retention-days: 7
